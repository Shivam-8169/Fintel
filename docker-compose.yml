version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintel-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./fintel.db
      - ENVIRONMENT=production
      - DEMO_MODE=true
      - JWT_SECRET=fintel-production-secret-academic-evaluation-token
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - fintel-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintel-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fintel-data:
